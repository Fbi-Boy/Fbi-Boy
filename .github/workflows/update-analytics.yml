name: Update GitHub Analytics

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_github_analytics.py"
      - ".github/workflows/update-analytics.yml"
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: github-analytics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync with latest main
        run: git pull --rebase origin main

      - name: Generate analytics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/generate_github_analytics.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-analytics-v2.svg
          if git diff --cached --quiet; then
            echo "Analytics unchanged."
            exit 0
          fi
          git commit -m "chore: update GitHub analytics"
          git push

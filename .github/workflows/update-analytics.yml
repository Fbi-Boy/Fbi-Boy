name: Update GitHub Analytics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/github-analytics-v21.svg"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: github-analytics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate analytics and publish safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

          python3 scripts/generate_github_analytics.py

          git add assets/github-analytics-v21.svg
          if git diff --cached --quiet; then
            echo "Analytics unchanged."
            exit 0
          fi

          git commit -m "chore: update GitHub analytics"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

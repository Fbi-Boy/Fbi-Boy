.hint{text-align:center;margin:16px 0 0;color:#c9d1d9}.hint code{background:#30363d;border-radius:6px;padding:4px 8px}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}.detail{display:grid;grid-template-columns:160px minmax(380px,1fr) 250px;gap:18px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
.level{text-align:center;border-right:1px solid var(--line);padding-right:16px}.level-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.level-value{font-size:24px;font-weight:800;margin-top:6px}.type{color:var(--muted);font-size:12px;margin-top:5px}
.chartbox{text-align:center}.chart-title{font-weight:700;margin-bottom:4px}.chartbox svg{max-width:100%;height:auto}
.projects{border-left:1px solid var(--line);padding-left:18px}.projects h3{font-size:15px;margin:0 0 10px}.projects ul{margin:0;padding-left:18px}.projects a{color:#58a6ff;text-decoration:none}.projects a:hover{text-decoration:underline}
.metric-list{display:grid;grid-template-columns:1fr 1fr;gap:5px 12px;margin-top:8px;font-size:12px;color:var(--muted);text-align:left}.metric-list strong{color:var(--text)}
.note{text-align:center;color:var(--muted);font-size:12px;margin-top:13px}
@media(max-width:800px){.detail{grid-template-columns:1fr}.level{border:0;border-bottom:1px solid var(--line);padding:0 0 14px}.projects{border:0;border-top:1px solid var(--line);padding:14px 0 0}}

function icon(id){return "https://skillicons.dev/icons?i="+id}
function renderGroups(){
document.getElementById("toolbox").innerHTML=GROUPS.map(function(g){
let x='<div class="group"><div class="group-title">'+g[0]+'</div><div class="icons">';
g[1].forEach(function(id){x+='<a class="tech" href="#'+id+'" data-id="'+id+'" title="'+S[id].name+'"><img src="'+icon(S[id].icon)+'" alt="'+S[id].name+'"></a>'});
return x+"</div></div>";
}).join("");
document.querySelectorAll(".tech").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();selectSkill(a.dataset.id);history.replaceState(null,"","#"+a.dataset.id)})});
}
function pts(values,cx,cy,r){
return values.map(function(v,i){const ang=-Math.PI/2+i*2*Math.PI/5;const rr=r*v/100;return[cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr]});
}
function poly(p){return p.map(function(x){return x[0].toFixed(1)+","+x[1].toFixed(1)}).join(" ")}
function radar(s){
const cx=240,cy=160,r=104;
let html='<svg viewBox="0 0 480 330" role="img" aria-label="'+s.name+' statistics"><rect width="480" height="330" rx="10" fill="#0d1117"/><text x="240" y="25" fill="#f0f6fc" font-family="Arial" font-size="15" font-weight="700" text-anchor="middle">'+s.name+' · Statistics</text><g fill="none" stroke="#30363d">';
[20,40,60,80,100].forEach(function(v){html+='<polygon points="'+poly(pts([v,v,v,v,v],cx,cy,r))+'"/>'});
pts([100,100,100,100,100],cx,cy,r).forEach(function(p){html+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>'});
html+='</g><polygon points="'+poly(pts(s.v,cx,cy,r))+'" fill="#8b5cf6" fill-opacity=".25" stroke="#a78bfa" stroke-width="3"/>';
const outer=pts([118,118,118,118,118],cx,cy,r);const actual=pts(s.v,cx,cy,r);
s.m.forEach(function(label,i){html+='<circle cx="'+actual[i][0]+'" cy="'+actual[i][1]+'" r="3.5" fill="#a78bfa"/><text x="'+outer[i][0]+'" y="'+outer[i][1]+'" fill="#c9d1d9" font-family="Arial" font-size="10" text-anchor="middle">'+label+'</text><text x="'+outer[i][0]+'" y="'+(outer[i][1]+13)+'" fill="#8b949e" font-family="Arial" font-size="10" text-anchor="middle">'+s.v[i]+'/100</text>'});
html+='<text x="240" y="312" fill="#8b949e" font-family="Arial" font-size="10" text-anchor="middle">Technology-specific evidence profile · 0–100</text></svg>';
return html;
}
function projects(s){
if(!s.p.length)return "<li>No tracked project yet</li>";
return s.p.map(function(p){return '<li><a href="'+REPO+p[1]+'" target="_blank" rel="noreferrer">'+p[0]+"</a></li>"}).join("");
}
function selectSkill(id){
const s=S[id]||S.php;
document.querySelectorAll(".tech").forEach(function(a){a.classList.toggle("active",a.dataset.id===id)});
let rows="";
s.m.forEach(function(m,i){rows+="<div>"+m+"</div><strong>"+s.v[i]+"/100</strong>"});
document.getElementById("detail").innerHTML='<div class="detail" id="selected-detail"><div class="level"><div class="level-label">Level</div><div class="level-value">'+s.level+'</div><div class="type">'+s.type+"</div></div><div class="chartbox"><div class="chart-title">Statistics</div>"+radar(s)+'<div class="metric-list">'+rows+'</div></div><div class="projects"><h3>Projects</h3><ul>'+projects(s)+"</ul></div></div>";
document.getElementById("selected-detail").scrollIntoView({behavior:"smooth",block:"nearest"});
}
renderGroups();selectSkill(location.hash.slice(1)||"php");

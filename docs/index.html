<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>F4B0Y — Technology Stats</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#a78bfa;--accentSoft:#c4b5fd}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.wrap{max-width:1050px;margin:auto;padding:28px 18px 52px}h1{text-align:center;font-size:24px;margin:0}.lead{text-align:center;color:var(--muted);margin:6px 0 20px}
.toolbox{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px}.group{margin-bottom:15px}.group:last-child{margin-bottom:0}.gt{text-align:center;font-weight:700;font-size:13px;margin-bottom:8px}.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
button.tech{appearance:none;border:1px solid transparent;background:var(--panel2);border-radius:8px;width:42px;height:42px;padding:5px;cursor:pointer}.tech:hover{border-color:#566171}.tech.active{border-color:var(--accent);background:#201b2d;box-shadow:0 0 0 1px rgba(167,139,250,.12)}.tech img{width:29px;height:29px;display:block;margin:auto}
.hint{text-align:center;margin:12px 0;color:#c9d1d9}.hint code{background:var(--border);border-radius:6px;padding:4px 8px}
hr{border:0;border-top:1px solid var(--border);margin:22px 0}
.card{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--panel)}
.head{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--border);background:#11161d}.head img{width:30px;height:30px}.head h2{font-size:17px;margin:0}.head p{margin:1px 0 0;font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:160px minmax(390px,1fr) 260px;min-height:350px}.col{padding:18px}.left{border-right:1px solid var(--border)}.right{border-left:1px solid var(--border)}
.k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.v{font-size:22px;font-weight:800;margin:2px 0 12px}.small{font-size:12px;color:var(--muted)}.center{text-align:center}.center h3,.right h3{font-size:13px;margin:0 0 8px}
.metric{display:grid;grid-template-columns:1fr auto;gap:8px;max-width:430px;margin:10px auto 0;text-align:left;font-size:12px;color:var(--muted)}.metric b{color:var(--text)}
ul{margin:6px 0 0;padding-left:18px}li{margin:8px 0;font-size:13px}.projects a{color:#58a6ff;text-decoration:none}.projects a:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{border:1px solid var(--border);background:var(--panel2);padding:4px 7px;border-radius:7px;font-size:11px;color:#c9d1d9}
.note{text-align:center;font-size:11px;color:var(--muted);margin-top:10px}
@media(max-width:800px){.grid{grid-template-columns:1fr}.left,.right{border:0}.left{border-bottom:1px solid var(--border)}.right{border-top:1px solid var(--border)}}
</style>
</head>
<body>
<main class="wrap">
<h1>🧰 Languages & Tools That I Used</h1>
<p class="lead">Select a technology to update one compact statistics panel.</p>
<section class="toolbox" id="toolbox"></section>
<div class="hint"><code>✨ Click a technology to view its statistics</code></div>
<hr>
<section class="card" id="panel"></section>
<p class="note">Single-page interaction: icons are buttons, the panel updates in place, and no new tab is opened.</p>
</main>
<script>
const project={
"Universal Task AI":"https://github.com/Fbi-Boy/universal-task-ai",

"latihan_flutter":"https://github.com/Fbi-Boy/latihan_flutter"
};
const data={

dart:{n:"Dart",t:"Language",i:"dart",l:"Intermediate",s:[["Repositories","1"],["Projects","1"],["Mobile","75%"],["Flutter","75%"]],m:["Project usage","Code evidence","Mobile scope","Flutter fit","Recency"],v:[35,35,75,75,40],p:["latihan_flutter"],r:["Flutter","Android"]},
cpp:{n:"C++",t:"Language",i:"cpp",l:"Learning",s:[["Repositories","0"],["Projects","0"],["Systems","45%"],["Evidence","10%"]],m:["Project usage","Code evidence","Systems scope","Ecosystem","Recency"],v:[15,10,45,35,15],p:[],r:["CMake","STL"]},
laravel:{n:"Laravel",t:"Framework",i:"laravel",l:"Intermediate",s:[["Repositories","2"],["Projects","2"],["Backend","95%"],["Integration","90%"]],m:["Project usage","Integration","Backend scope","Ecosystem","Recency"],v:[90,90,95,95,90],p:["Madura Mart","PT Putra Prananta"],r:["PHP","MySQL","Tailwind CSS"]},
flutter:{n:"Flutter",t:"SDK / Framework",i:"flutter",l:"Intermediate",s:[["Repositories","1"],["Projects","1"],["Mobile","80%"],["Dart fit","80%"]],m:["Project usage","Mobile scope","UI scope","Dart integration","Recency"],v:[40,45,80,80,45],p:["latihan_flutter"],r:["Dart","Android"]},
git:{n:"Git",t:"Developer Tool",i:"git",l:"Intermediate",s:[["Repositories","4"],["Projects","4"],["Versioning","95%"],["Branch workflow","85%"]],m:["Project usage","Version control","Branch workflow","Collaboration","Recency"],v:[95,95,85,80,95],p:["Universal Task AI","Madura Mart","PT Putra Prananta","latihan_flutter"],r:["GitHub","GitHub Actions"]},
github:{n:"GitHub",t:"Developer Tool",i:"github",l:"Intermediate",s:[["Repositories","4"],["Projects","4"],["Repository workflow","95%"],["Collaboration","85%"]],m:["Project usage","Repository workflow","Collaboration","Automation","Recency"],v:[95,95,85,90,95],p:["Universal Task AI","Madura Mart","PT Putra Prananta","latihan_flutter"],r:["Git","GitHub Actions"]},
vscode:{n:"VS Code",t:"Developer Tool",i:"vscode",l:"Intermediate",s:[["Repositories","4"],["Projects","4"],["Languages","90%"],["Editor workflow","90%"]],m:["Project usage","Editor workflow","Language coverage","Extensions","Recency"],v:[85,90,90,85,95],p:["Universal Task AI","Madura Mart","PT Putra Prananta","latihan_flutter"],r:["Git","Docker","Extensions"]},

mysql:{n:"MySQL",t:"Database",i:"mysql",l:"Intermediate",s:[["Repositories","2"],["Projects","2"],["Schema","85%"],["Integration","85%"]],m:["Project usage","Data layer","Schema","Integration","Recency"],v:[75,75,85,85,80],p:["Madura Mart","PT Putra Prananta"],r:["SQL","Laravel","SQLite"]},
postgresql:{n:"PostgreSQL",t:"Database",i:"postgres",l:"Learning",s:[["Repositories","0"],["Projects","0"],["Schema","40%"],["Evidence","20%"]],m:["Project usage","Data layer","Schema","Integration","Recency"],v:[25,20,40,35,25],p:[],r:["SQL","Supabase"]},
redis:{n:"Redis",t:"Database / Cache",i:"redis",l:"Learning",s:[["Repositories","1"],["Projects","1"],["Caching","65%"],["Backend","75%"]],m:["Project usage","Caching","Integration","Backend fit","Recency"],v:[35,35,65,75,65],p:["Universal Task AI"],r:["Python","FastAPI","Docker"]},
nginx:{n:"Nginx",t:"Cloud / DevOps",i:"nginx",l:"Learning",s:[["Repositories","0"],["Projects","0"],["Web Server","50%"],["Deployment","50%"]],m:["Project usage","Web serving","Reverse proxy","Deployment","Recency"],v:[30,25,50,50,30],p:[],r:["Linux","Docker","Laravel"]},
aws:{n:"AWS",t:"Cloud / DevOps",i:"aws",l:"Learning",s:[["Repositories","0"],["Projects","0"],["Cloud","35%"],["Infrastructure","35%"]],m:["Project usage","Cloud breadth","Infrastructure","Integration","Recency"],v:[15,10,35,25,15],p:[],r:["EC2","S3","IAM"]}
};
const groups=[
["Languages",["php","python","js","kotlin","dart","cpp"]],
["Frameworks & Libraries",["laravel","flutter"]],
["Developer Tools",["git","github","vscode","docker"]],
["Databases",["mysql","postgresql","redis"]],
["Cloud & DevOps",["nginx","aws"]]
];
function icon(id){return id==="sql"?"../assets/sql.svg":"https://skillicons.dev/icons?i="+id}
function render(){
document.getElementById("toolbox").innerHTML=groups.map(g=>'<div class="group"><div class="gt">'+g[0]+'</div><div class="icons">'+g[1].map(id=>'<button class="tech" data-id="'+id+'" title="'+data[id].n+'"><img src="'+icon(data[id].i)+'" alt="'+data[id].n+'"></button>').join("")+'</div></div>').join("");
document.querySelectorAll(".tech").forEach(b=>b.addEventListener("click",()=>select(b.dataset.id)));
}
function pts(vals,cx,cy,r){return vals.map((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/5,rr=r*v/100;return[cx+Math.cos(a)*rr,cy+Math.sin(a)*rr]})}
function poly(p){return p.map(x=>x[0].toFixed(1)+","+x[1].toFixed(1)).join(" ")}
function radar(s){
const cx=250,cy=145,r=83,o=pts([115,115,115,115,115],cx,cy,r),a=pts(s.v,cx,cy,r);
let x='<svg viewBox="0 0 500 295" width="100%" aria-label="'+s.n+' statistics radar"><g fill="none" stroke="#30363d">';
[20,40,60,80,100].forEach(v=>x+='<polygon points="'+poly(pts([v,v,v,v,v],cx,cy,r))+'"/>');
pts([100,100,100,100,100],cx,cy,r).forEach(p=>x+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>');
x+='</g><polygon points="'+poly(a)+'" fill="#a78bfa" fill-opacity=".25" stroke="#c4b5fd" stroke-width="3"/>';
s.m.forEach((m,i)=>x+='<circle cx="'+a[i][0]+'" cy="'+a[i][1]+'" r="3" fill="#c4b5fd"/><text x="'+o[i][0]+'" y="'+o[i][1]+'" fill="#c9d1d9" font-size="10" font-family="Arial" text-anchor="middle">'+m+'</text><text x="'+o[i][0]+'" y="'+(o[i][1]+12)+'" fill="#8b949e" font-size="9" font-family="Arial" text-anchor="middle">'+s.v[i]+'</text>');
return x+"</svg>";
}
function select(id){
const catalog={
ts:["TypeScript","Language","ts"],c:["C","Language","c"],java:["Java","Language","java"],cs:["C#","Language","cs"],go:["Go","Language","go"],rust:["Rust","Language","rust"],ruby:["Ruby","Language","ruby"],swift:["Swift","Language","swift"],html:["HTML","Markup","html"],css:["CSS","Styling","css"],bash:["Bash","Shell","bash"],powershell:["PowerShell","Shell","powershell"],sql:["SQL","Query Language","sql"],symfony:["Symfony","Framework","symfony"],nodejs:["Node.js","Runtime","nodejs"],express:["Express","Framework","express"],react:["React","Library","react"],nextjs:["Next.js","Framework","nextjs"],vue:["Vue","Framework","vue"],angular:["Angular","Framework","angular"],tailwind:["Tailwind CSS","Styling","tailwind"],bootstrap:["Bootstrap","Styling","bootstrap"],alpinejs:["Alpine.js","Library","alpinejs"],androidstudio:["Android Studio","IDE","androidstudio"],spring:["Spring","Framework","spring"],dotnet:[" .NET".trim(),"Framework","dotnet"],gitlab:["GitLab","Developer Tool","gitlab"],pycharm:["PyCharm","IDE","pycharm"],phpstorm:["PhpStorm","IDE","phpstorm"],linux:["Linux","OS","linux"],postman:["Postman","API Tool","postman"],npm:["npm","Package Manager","npm"],yarn:["Yarn","Package Manager","yarn"],pnpm:["pnpm","Package Manager","pnpm"],bun:["Bun","Runtime","bun"],vite:["Vite","Build Tool","vite"],figma:["Figma","Design Tool","figma"],sqlite:["SQLite","Database","sqlite"],mongodb:["MongoDB","Database","mongodb"],firebase:["Firebase","Backend Platform","firebase"],supabase:["Supabase","Backend Platform","supabase"],ansible:["Ansible","Automation","ansible"],arduino:["Arduino","Hardware","arduino"],astro:["Astro","Framework","astro"],django:["Django","Framework","django"],fastapi:["FastAPI","Framework","fastapi"],pytorch:["PyTorch","AI Framework","pytorch"],tensorflow:["TensorFlow","AI Framework","tensorflow"],threejs:["Three.js","3D Library","threejs"],unity:["Unity","Game Engine","unity"],unreal:["Unreal Engine","Game Engine","unreal"],vim:["Vim","Editor","vim"],webpack:["Webpack","Build Tool","webpack"],wordpress:["WordPress","CMS","wordpress"],selenium:["Selenium","Automation Tool","selenium"]};
const fallback=catalog[id]||[id.toUpperCase(),"Technology",id];
const s=data[id]||{n:fallback[0],t:fallback[1],i:fallback[2],l:"Reference",s:[["Tracked repositories","—"],["Tracked projects","—"],["Usage","Reference"],["Evidence","See project links"]],m:["Project usage","Code evidence","Ecosystem fit","Related tooling","Profile reference"],v:[50,50,50,50,50],p:[],r:[]};
document.querySelectorAll(".tech").forEach(b=>b.classList.toggle("active",b.dataset.id===id));
const stats=s.s.map(x=>'<div class="stat"><div class="k">'+x[0]+'</div><div class="v">'+x[1]+'</div></div>').join("");
const metrics=s.m.map((m,i)=>'<div>'+m+'</div><b>'+s.v[i]+'/100</b>').join("");
const projects=s.p.length?s.p.map(p=>'<li><a href="'+project[p]+'">'+p+"</a></li>").join(""):"<li>No tracked project yet</li>";
const related=s.r.map(x=>'<span class="chip">'+x+"</span>").join("");
document.getElementById("panel").innerHTML='<div class="head"><img src="'+icon(s.i)+'" alt="'+s.n+'"><div><h2>'+s.n+'</h2><p>'+s.t+'</p></div></div><div class="grid"><aside class="col left"><div class="badge"><div class="k">Level</div><div class="v">'+s.l+'</div></div>'+stats+'</aside><section class="col center"><h3>Statistics</h3>'+radar(s)+'<div class="metric">'+metrics+'</div></section><aside class="col right"><h3>Projects</h3><ul class="projects">'+projects+'</ul><div style="margin-top:18px"><h3>Related</h3><div class="chips">'+related+'</div></div></aside></div>';
}
render();select(location.hash.slice(1)||"php");
document.addEventListener("click",e=>{const b=e.target.closest(".tech");if(b)history.replaceState(null,"","#"+b.dataset.id)});
</script>
</body>
</html>

<style>
:root{
  color-scheme:dark;
  --bg:#0b0f14;
  --panel:#111821;
  --panel-2:#0d131a;
  --line:#2a3440;
  --text:#e6edf3;
  --muted:#8b98a8;
  --accent:#a78bfa;
  --accent-2:#c4b5fd;
  --green:#22c55e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.wrap{max-width:1080px;margin:auto;padding:28px 18px 60px}
h1{font-size:26px;margin:0;text-align:center}
.lead{text-align:center;color:var(--muted);margin:7px 0 22px}
.tools{
  border:1px solid var(--line);border-radius:12px;background:var(--panel);
  padding:18px 16px;
}
.group{margin:0 0 18px}
.group:last-child{margin-bottom:0}
.group-title{text-align:center;font-weight:700;margin-bottom:9px;color:#f0f6fc}
.icons{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.tech{
  width:44px;height:44px;display:flex;align-items:center;justify-content:center;
  border:1px solid transparent;border-radius:9px;background:#161e27;
  cursor:pointer;transition:.16s ease;text-decoration:none;
}
.tech:hover{border-color:#566171;transform:translateY(-1px)}
.tech.active{border-color:var(--accent);box-shadow:0 0 0 1px rgba(167,139,250,.18);background:#1d1829}
.tech img{width:29px;height:29px}
.hint{margin:14px 0 0;text-align:center}
.hint code{background:#2a3440;color:#e6edf3;border-radius:6px;padding:4px 9px}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.detail{
  border:1px solid var(--line);border-radius:12px;background:var(--panel);
  overflow:hidden;
}
.detail-head{
  display:flex;align-items:center;gap:10px;padding:14px 18px;
  border-bottom:1px solid var(--line);background:#0f151d;
}
.detail-head img{width:32px;height:32px}
.detail-head h2{font-size:18px;margin:0}
.detail-head small{display:block;color:var(--muted);margin-top:2px}
.grid{
  display:grid;grid-template-columns:180px minmax(380px,1fr) 280px;
  min-height:390px;
}
.left,.right{padding:20px}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.stat{padding:11px 0;border-bottom:1px solid #202a35}
.stat:last-child{border-bottom:0}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.stat-value{font-size:21px;font-weight:800;margin-top:2px}
.badge{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#231f33;color:var(--accent-2);font-size:11px}
.center{padding:18px;text-align:center}
.center h3{font-size:14px;margin:0 0 6px}
.chart{width:100%;max-width:500px;margin:0 auto}
.metric-list{
  display:grid;grid-template-columns:1fr 1fr;gap:7px 12px;
  max-width:420px;margin:10px auto 0;text-align:left;
  color:var(--muted);font-size:12px;
}
.metric-list div:nth-child(even){text-align:right;color:var(--text);font-weight:700}
.right h3{font-size:14px;margin:0 0 12px}
.projects{margin:0;padding-left:18px}
.projects li{margin:8px 0}
.projects a{color:#58a6ff;text-decoration:none}
.projects a:hover{text-decoration:underline}
.related{margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{padding:5px 8px;border:1px solid var(--line);border-radius:7px;color:#c9d1d9;background:var(--panel-2);font-size:11px}
.note{text-align:center;color:var(--muted);font-size:11px;margin-top:13px}
@media(max-width:820px){
  .grid{grid-template-columns:1fr}
  .left,.right{border:0}
  .right{border-top:1px solid var(--line)}
  .left{border-bottom:1px solid var(--line)}
}
</style>

function icon(id){return "https://skillicons.dev/icons?i="+id}
function renderIcons(){
document.getElementById("tools").innerHTML=groups.map(function(g){
return '<div class="group"><div class="group-title">'+g[0]+'</div><div class="icons">'+g[1].map(function(id){
return '<a class="tech" href="#'+id+'" data-id="'+id+'" title="'+data[id].name+'"><img src="'+icon(data[id].icon)+'" alt="'+data[id].name+'"></a>'
}).join("")+'</div></div>'

el.addEventListener("click",function(e){e.preventDefault();selectSkill(el.dataset.id);history.replaceState(null,"","#"+el.dataset.id)})
})
}
function pnts(vals,cx,cy,r){
return vals.map(function(v,i){const ang=-Math.PI/2+i*2*Math.PI/5,rr=r*v/100;return[cx+Math.cos(ang)*rr,cy+Math.sin(ang)*rr]})
}
function poly(ps){return ps.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1)}).join(" ")}
function radar(s){
const cx=250,cy=165,r=105,outer=pnts([118,118,118,118,118],cx,cy,r),actual=pnts(s.values,cx,cy,r);
let x='<svg class="chart" viewBox="0 0 500 330"><rect width="500" height="330" rx="10" fill="#0d131a"/><text x="250" y="25" fill="#e6edf3" font-family="Arial" font-size="15" font-weight="700" text-anchor="middle">'+s.name+' Statistics</text><g fill="none" stroke="#303844">';
[20,40,60,80,100].forEach(function(v){x+='<polygon points="'+poly(pnts([v,v,v,v,v],cx,cy,r))+'"/>'});
pnts([100,100,100,100,100],cx,cy,r).forEach(function(p){x+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'"/>'});
x+='</g><polygon points="'+poly(actual)+'" fill="#a78bfa" fill-opacity=".24" stroke="#c4b5fd" stroke-width="3"/>';
s.metrics.forEach(function(m,i){x+='<circle cx="'+actual[i][0]+'" cy="'+actual[i][1]+'" r="3.5" fill="#c4b5fd"/><text x="'+outer[i][0]+'" y="'+outer[i][1]+'" fill="#c9d1d9" font-family="Arial" font-size="10" text-anchor="middle">'+m+'</text><text x="'+outer[i][0]+'" y="'+(outer[i][1]+13)+'" fill="#8b98a8" font-family="Arial" font-size="10" text-anchor="middle">'+s.values[i]+'/100</text>'});
return x+'<text x="250" y="315" fill="#8b98a8" font-family="Arial" font-size="10" text-anchor="middle">Technology-specific evidence profile · 0–100</text></svg>';
}
function projectHtml(s){return s.projects.length?s.projects.map(function(p){return '<li><a href="'+R+p[1]+'">'+p[0]+'</a></li>'}).join(""):'<li>No tracked project yet</li>'}
function selectSkill(id){
const s=data[id]||data.php;
document.querySelectorAll(".tech").forEach(function(a){a.classList.toggle("active",a.dataset.id===id)});
const statHtml=s.stats.map(function(v){return '<div class="stat"><div class="stat-label">'+v[0]+'</div><div class="stat-value">'+v[1]+'</div></div>'}).join("");
const metricHtml=s.metrics.map(function(m,i){return '<div>'+m+'</div><div>'+s.values[i]+'/100</div>'}).join("");
const related=s.related.map(function(x){return '<span class="chip">'+x+'</span>'}).join("");
document.getElementById("detail").innerHTML=
'<div class="detail-head"><img src="'+icon(s.icon)+'" alt="'+s.name+'"><div><h2>'+s.name+'</h2><small>'+s.type+' · selected technology</small></div></div>'+
'<div class="grid">'+
'<aside class="left">'+statHtml+'<span class="badge">'+s.level+'</span></aside>'+
'<section class="center"><h3>Usage Profile</h3>'+radar(s)+'<div class="metric-list">'+metricHtml+'</div></section>'+
'<aside class="right"><h3>Projects</h3><ul class="projects">'+projectHtml(s)+'</ul><div class="related"><h3>Related</h3><div class="chips">'+related+'</div></div></aside>'+
'</div>';
